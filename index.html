<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SiriAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .left-card {
            min-height: 400px;
            background-color: gray;
            border-radius: 24px;
        }

        .left-card-below {
            min-height: 100px;
            background-color: gray;
            border-radius: 24px;
        }

        .left-card-bottom {
            min-height: 150px;
            background-color: gray;
            border-radius: 24px;
        }

        .horizontal-card {
            min-height: 100px;
            background-color: gray;
            border-radius: 24px;
        }

        .three-card {
            min-height: 290px;
            background-color: gray;
            border-radius: 24px;
        }

        .three-card-below {
            min-height: 260px;
            background-color: gray;
            border-radius: 24px;
        }
    </style>
</head>

<body>
    <div class="container-fluid p-3">
        <div class="row">

            <!-- Left column (5/12) with nested rows -->
            <div class="col-5">
                <div class="row">
                    <!-- Upper tall card -->
                    <div class="col-12 p-1">
                        <div class="left-card p-1">
                            <!-- Content -->
                        </div>
                    </div>

                    <!-- Middle box -->
                    <div class="col-12 p-1">
                        <div class="left-card-below p-1">
                            <!-- Content -->
                        </div>
                    </div>

                    <!--1 Bottom box -->
                    <div class="col-6 p-1">
                        <div class="left-card-bottom p-1">
                            <!-- Content -->
                        </div>
                    </div>
                    <!--2 Bottom box -->
                    <div class="col-6 p-1">
                        <div class="left-card-bottom p-1">
                            <!-- Content -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right column (7/12) -->
            <div class="col-7">
                <div class="row">

                    <!-- Top horizontal card -->
                    <div class="col-12 p-1">
                        <div class="horizontal-card p-1">
                            <!-- Content -->
                        </div>
                    </div>

                    <!-- Three boxes middle -->
                    <!-- Box 1 -->
                    <div class="col-4 p-1">
                        <div class="three-card p-1">
                            <!-- Content -->
                        </div>
                    </div>

                    <!-- Box 2 -->
                    <div class="col-4 p-1">
                        <div class="three-card p-1">
                            <!-- Content -->
                        </div>
                    </div>

                    <!-- Box 3 -->
                    <div class="col-4 p-1">
                        <div class="three-card p-1">
                            <!-- Content -->
                        </div>
                    </div>

                    <!-- Three boxes bottom -->
                    <!-- Box 1 -->
                    <div class="col-3 p-1">
                        <div class="three-card-below p-1">
                            <!-- Content -->
                        </div>
                    </div>

                    <!-- Box 2 -->
                    <div class="col-6 p-1">
                        <div class="three-card-below p-1">
                            <!-- Content -->
                        </div>
                    </div>

                    <!-- Box 3 -->
                    <div class="col-3 p-1">
                        <div class="three-card-below p-1">
                            <!-- Content -->
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
