<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Valorant-Aeris Bundle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Rajdhani:wght@500;600;700&display=swap"
        rel="stylesheet">

    <style>
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -2;
            pointer-events: none;
            filter: contrast(105%) brightness(90%);
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            z-index: -1;
        }

        .content {
            position: relative;
            z-index: 1;
        }

        .title-serif {
            font-family: 'Cinzel', serif;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            font-size: clamp(2.8rem, 6.5vw, 5.5rem);
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 42, 127, 0.4), 0 0 40px rgba(255, 42, 127, 0.2);
        }

        .weapon-card {
            background: rgba(28, 14, 28, 0.75);
            border: 1px solid rgba(255, 42, 127, 0.35);
            border-radius: 4px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            position: relative;
            overflow: hidden;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .weapon-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ff2a7f, transparent);
            opacity: 0.4;
            transition: opacity 0.3s ease;
        }

        .weapon-card:hover {
            transform: translateY(-8px);
            border-color: #ff2a7f;
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.75), 0 0 25px rgba(255, 42, 127, 0.25);
        }

        .weapon-card:hover::before {
            opacity: 1;
        }

        .weapon-img-wrapper {
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .weapon-card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.65));
            transition: transform 0.4s ease;
        }

        .weapon-card:hover img {
            transform: scale(1.08) rotate(-1deg);
        }

        .badge-category {
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: rgba(255, 42, 127, 0.15);
            color: #ff94cb;
            border: 1px solid rgba(255, 42, 127, 0.4);
            border-radius: 2px;
            padding: 4px 10px;
        }

        .price-badge {
            color: #ffd54a;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .swatch-container {
            position: absolute;
            top: 24px;
            right: 28px;
            z-index: 20;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(28, 14, 28, 0.6);
            border: 1px solid rgba(255, 42, 127, 0.35);
            padding: 6px 14px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
        }

        .swatch-logo-img {
            width: 34px;
            height: auto;
            display: block;
            filter: drop-shadow(0 0 6px rgba(255, 42, 127, 0.6));
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .swatch-label {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            color: #ffa3d7;
            text-transform: uppercase;
            font-weight: 700;
        }

        @media (min-width: 768px) {
            .title-serif {
                font-size: 5.5rem;
            }
        }

    </style>
</head>

<body>

    <div class="swatch-container">
        <span class="swatch-label">Variant 02</span>
        <img src="assets/images/swatch.png" alt="Aeris Swatch" class="swatch-logo-img">
    </div>

    <!-- Background video -->
    <video class="bg-video" autoplay muted loop playsinline>
        <source src="assets/video/bg.mp4" type="video/mp4">
    </video>

    <!-- Overlay -->
    <div class="bg-overlay"></div>

    <!--Content -->
    <main class="content container py-5 text-center">
        <h1 class="title-serif fw-bold">A E R I S</h1>
        <p style="color: #ffa3d7; font-weight: 500;">Variant 2 - Weapon Exclusive Bundle</p>
    </main>

    <!--Cards -->
    <div class="row justify-content-center g-4" id="weapon-list"></div>

    <script>
        const aerisData = {
            "weapons": [
                {
                    "id": 1,
                    "name": "Aeris Vandal",
                    "category": "Rifle",
                    "price": "2,375 VP",
                    "levels": "4 Upgrade Levels",
                    "image": "assets/images/vandal.webp",
                    "bg": "#2b1424",
                    "color": "#ffa3d7",
                    "border": "#ff007f"
                },
                {
                    "id": 2,
                    "name": "Aeris Bandit",
                    "category": "Sidearm",
                    "price": "2,375 VP",
                    "levels": "4 Upgrade Levels",
                    "image": "assets/images/bandit.webp",
                    "bg": "#2b1424",
                    "color": "#ffa3d7",
                    "border": "#ff007f"
                },
                {
                    "id": 3,
                    "name": "Aeris Guardian",
                    "category": "Rifle",
                    "price": "2,375 VP",
                    "levels": "4 Upgrade Levels",
                    "image": "assets/images/guardian.png",
                    "bg": "#2b1424",
                    "color": "#ffa3d7",
                    "border": "#ff007f"
                },
                {
                    "id": 4,
                    "name": "Aeris Marshal",
                    "category": "Sniper",
                    "price": "2,375 VP",
                    "levels": "4 Upgrade Levels",
                    "image": "assets/images/marshal.png",
                    "bg": "#2b1424",
                    "color": "#ffa3d7",
                    "border": "#ff007f"
                },
                {
                    "id": 5,
                    "name": "Suit of Aeris",
                    "category": "Melee",
                    "price": "5,350 VP",
                    "levels": "Transforming Cards",
                    "image": "assets/images/melee.png",
                    "bg": "#2b1424",
                    "color": "#ffa3d7",
                    "border": "#ff007f"
                }
            ]
        };

        let output = "";

        for (let i = 0; i < aerisData.weapons.length; i++) {
            let item = aerisData.weapons[i];

            output += `
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="card weapon-card p-4 m-1 mx-3 h-100 text-center">
                        
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="badge badge-category">${item.category}</span>
                            <span class="price-badge">◈ ${item.price}</span>
                        </div>

                        <!-- Image -->
                        <div class="weapon-img-wrapper my-2">
                            <img src="${item.image}" alt="${item.name}" loading="lazy">
                        </div>

                        <!-- Details -->
<h4 class="fw-bold mb-1 text-white" style="letter-spacing: 1.5px; font-size: 1.35rem; font-family: 'Cinzel', serif;">
    ${item.name}
</h4>

                        <div class="mt-auto pt-3 border-top border-secondary border-opacity-25 text-start">
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="text-white-50 small text-uppercase" style="letter-spacing: 1px;">Features</span>
                                <span class="text-light small font-monospace">${item.levels}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        document.getElementById("weapon-list").innerHTML = output;
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
