<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Valorant-Aeris Bundle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Rajdhani:wght@500;600;700&display=swap"
        rel="stylesheet">

    <style>
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            object-fit: cover;
            z-index: -2;
            pointer-events: none;
            filter: contrast(105%) brightness(90%);
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            z-index: -1;
        }

        .content {
            position: relative;
            z-index: 1;
        }

        .title-serif {
            font-family: 'Cinzel', serif;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            font-size: clamp(2.8rem, 6.5vw, 5.5rem);
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 42, 127, 0.4), 0 0 40px rgba(255, 42, 127, 0.2);
        }

        .weapon-card {
            background: rgba(28, 14, 28, 0.75);
            border: 1px solid rgba(255, 42, 127, 0.35);
            border-radius: 30px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            position: relative;
            overflow: hidden;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .weapon-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ff2a7f, transparent);
            opacity: 0.4;
            transition: opacity 0.3s ease;
        }

        .weapon-card:hover {
            transform: translateY(-8px);
            border-color: #ff2a7f;
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.75), 0 0 25px rgba(255, 42, 127, 0.25);
        }

        .weapon-card:hover::before {
            opacity: 1;
        }

        .weapon-card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.65));
            transition: transform 0.4s ease;
        }

        .weapon-card:hover img {
            transform: scale(1.08) rotate(-1deg);
        }

        .badge-category {
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: rgba(255, 42, 127, 0.15);
            color: #ff94cb;
            border: 1px solid rgba(255, 42, 127, 0.4);
            border-radius: 2px;
            padding: 4px 10px;
        }

        .price-badge {
            color: #ffd54a;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .swatch-container {
            position: absolute;
            top: 24px;
            right: 28px;
            z-index: 20;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(28, 14, 28, 0.6);
            border: 1px solid rgba(255, 42, 127, 0.35);
            padding: 6px 14px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .swatch-logo-img {
            width: 34px;
            height: auto;
            display: block;
            filter: drop-shadow(0 0 6px rgba(255, 42, 127, 0.6));
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .swatch-label {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            color: #ffa3d7;
            text-transform: uppercase;
            font-weight: 700;
        }

        .weapon-wrapper {
            position: relative;
            width: 100%;
            height: 180px;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .weapon-img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.65));
            opacity: 1;
            transform: scale(1);
            transition: opacity 0.4s ease, transform 0.4s ease;
            z-index: 2;
        }

        .weapon-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transform: scale(1.04);
            transition: opacity 0.45s ease, transform 0.45s ease;
            z-index: 1;
        }

        .weapon-card:hover .weapon-img {
            opacity: 0;
            transform: scale(0.95);
        }

        .weapon-card:hover .weapon-video {
            opacity: 1;
            transform: scale(1);
            z-index: 3;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin: 10px 0;
            padding: 8px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            text-align: center;
        }

        .stat-label {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-val {
            font-size: 0.8rem;
            color: #ffd54a;
            font-weight: 600;
        }

        @media (min-width: 768px) {
            .title-serif {
                font-size: 5.5rem;
            }
        }
    </style>
</head>

<body>

    <div class="swatch-container">
        <span class="swatch-label">Variant 02</span>
        <img src="assets/images/swatch.png" alt="Aeris Swatch" class="swatch-logo-img">
    </div>

    <!-- Background video -->
    <video id="bg-video" class="bg-video" autoplay loop playsinline>
        <source src="assets/video/bg.mp4" type="video/mp4">
    </video>

    <!-- Overlay -->
    <div class="bg-overlay"></div>

    <!--Content -->
    <main class="content container py-5 text-center">
        <h1 class="title-serif fw-bold">A E R I S</h1>
        <p style="color: #ffa3d7; font-weight: 500;">Variant 2 - Weapon Exclusive Bundle</p>
    </main>

    <!--Cards -->
    <div class="container my-5">
        <div class="row justify-content-center g-4" id="weapon-list"></div>
    </div>

    <script>
        const aerisData = {
            "weapons": [
                {
                    "id": 1,
                    "name": "Aeris Vandal",
                    "category": "Rifle",
                    "price": "2,375 VP",
                    "levels": "4 Upgrade Levels",
                    "image": "assets/images/vandal.webp",
                    "video": "assets/video/v-vandal.mp4",
                    "fireRate": "9.75 rounds/sec",
                    "magSize": "25 rounds",
                    "headDamage": "160 DMG"
                },
                {
                    "id": 2,
                    "name": "Aeris Bandit",
                    "category": "Sidearm",
                    "price": "2,375 VP",
                    "levels": "4 Upgrade Levels",
                    "image": "assets/images/bandit.webp",
                    "video": "assets/video/v-bandit.mp4",
                    "fireRate": "3.33 rounds/sec",
                    "magSize": "6 rounds",
                    "headDamage": "150 DMG"
                },
                {
                    "id": 3,
                    "name": "Aeris Guardian",
                    "category": "Rifle",
                    "price": "2,375 VP",
                    "levels": "4 Upgrade Levels",
                    "image": "assets/images/guardian.png",
                    "video": "assets/video/v-guardian.mp4",
                    "fireRate": "5.25 rounds/sec",
                    "magSize": "12 rounds",
                    "headDamage": "195 DMG"
                },
                {
                    "id": 4,
                    "name": "Aeris Marshal",
                    "category": "Sniper",
                    "price": "2,375 VP",
                    "levels": "4 Upgrade Levels",
                    "image": "assets/images/marshal.png",
                    "video": "assets/video/v-marshal.mp4",
                    "fireRate": "1.5 rounds/sec",
                    "magSize": "5 rounds",
                    "headDamage": "202 DMG"
                },
                {
                    "id": 5,
                    "name": "Suit of Aeris",
                    "category": "Melee",
                    "price": "5,350 VP",
                    "levels": "Transforming Cards",
                    "image": "assets/images/melee.png",
                    "video": "assets/video/v-melee.mp4",
                    "fireRate": "Slash / Thrust",
                    "magSize": "Infinite",
                    "headDamage": "Special Animation"
                }
            ]
        };

        let output = "";

        for (let i = 0; i < aerisData.weapons.length; i++) {
            let item = aerisData.weapons[i];

            output += `
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="card weapon-card p-4 m-1 mx-3 h-100 text-center">
                        
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="badge badge-category">${item.category}</span>
                            <span class="price-badge">◈ ${item.price}</span>
                        </div>

                        <!-- Image + Video Overlay -->
                        <div class="weapon-wrapper my-2">
                            <img src="${item.image}" alt="${item.name}" class="weapon-img" loading="lazy">
                            <video class="weapon-video" loop playsinline preload="metadata">
                                <source src="${item.video}" type="video/mp4">
                            </video>
                        </div>

                        <!-- Name -->
                        <h4 class="fw-bold mb-1 text-white" style="letter-spacing: 1.5px; font-size: 1.35rem; font-family: 'Cinzel', serif;">
                            ${item.name}
                        </h4>

                        <!-- Stats -->
                        <div class="stat-grid">
                            <div class="stat-item">
                                <span class="stat-label">Fire Rate</span>
                                <span class="stat-val">${item.fireRate}</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">Magazine</span>
                                <span class="stat-val">${item.magSize}</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">Headshot</span>
                                <span class="stat-val">${item.headDamage}</span>
                            </div>
                        </div>

                        <!-- Details -->
                        <div class="mt-auto pt-3 border-top border-secondary border-opacity-25 text-start">
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="text-white-50 small text-uppercase" style="letter-spacing: 1px;">Features</span>
                                <span class="small font-monospace" style="color: #ff94cb;">${item.levels}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        document.getElementById("weapon-list").innerHTML = output;

        // Play video on hover
        const cards = document.querySelectorAll('.weapon-card');
        const bgVideo = document.getElementById('bg-video');

        bgVideo.muted = true;
        bgVideo.volume = 0.35;

        function enableAudio() {
            bgVideo.muted = false;
            window.removeEventListener('click', enableAudio);
            window.removeEventListener('keydown', enableAudio);
        }
        window.addEventListener('click', enableAudio);
        window.addEventListener('keydown', enableAudio);

        cards.forEach(card => {
            const weaponVideo = card.querySelector('.weapon-video');
            if (!weaponVideo) return;

            weaponVideo.volume = 0.8; 

            card.addEventListener('mouseenter', () => {
                // pang mute when hover
                bgVideo.muted = true;

                // video with sound
                weaponVideo.muted = false;
                const playPromise = weaponVideo.play();
                if (playPromise !== undefined) {
                    playPromise.catch(() => {});
                }
            });

            card.addEventListener('mouseleave', () => {
                // Pause and reset hovered video
                weaponVideo.pause();
                weaponVideo.currentTime = 0;
                weaponVideo.muted = true;

                //restore
                bgVideo.muted = false;
            });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
